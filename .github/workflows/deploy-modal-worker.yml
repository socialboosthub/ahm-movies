name: Deploy AHM Movies worker to Modal

on:
  workflow_dispatch:
  push:
    branches:
      - feature/modal-worker
    paths:
      - "worker/**"
      - ".github/workflows/deploy-modal-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade modal

      - name: Deploy worker
        run: modal deploy worker/modal_app.py
      - name: Verify deployed worker health
        shell: bash
        run: |
          for attempt in {1..10}; do
            status=$(curl --silent --show-error --output /tmp/ahm-worker-health.txt --write-out "%{http_code}" https://ashrafsquad001--ahm-movies-worker-fastapi-app.us-east.modal.run/ || true)
            echo "Modal worker root health HTTP ${status}"
            cat /tmp/ahm-worker-health.txt || true
            if [ "${status}" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Modal worker health endpoint did not return HTTP 200."
          exit 1
